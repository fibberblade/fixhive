<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-819HFHM37T"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-819HFHM37T');
    </script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FixHive Admin — Promotions</title>
  <meta name="robots" content="noindex, nofollow" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --dark: #0D1B2A; --amber: #F5A623; --bg: #F0F2F5;
      --white: #fff; --text: #1A1A1A; --muted: #6B7280;
      --border: #D1D5DB; --red: #EF4444; --green: #10B981;
    }
    body { font-family: 'Segoe UI', Arial, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

    /* ── LOGIN ── */
    #loginScreen {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
    }
    .login-box {
      background: var(--white); border-radius: 12px; padding: 2.5rem 2rem;
      width: 100%; max-width: 380px; box-shadow: 0 8px 32px rgba(0,0,0,0.12);
      text-align: center;
    }
    .login-logo { font-size: 1.8rem; font-weight: 800; color: var(--dark); margin-bottom: 0.3rem; }
    .login-logo span { color: var(--amber); }
    .login-box p { font-size: 0.87rem; color: var(--muted); margin-bottom: 1.8rem; }
    .login-box input {
      width: 100%; padding: 0.75rem 1rem; border: 1.5px solid var(--border);
      border-radius: 6px; font-size: 0.95rem; margin-bottom: 1rem; outline: none;
    }
    .login-box input:focus { border-color: var(--amber); }
    .login-btn {
      width: 100%; background: var(--amber); color: var(--dark); font-weight: 700;
      font-size: 0.97rem; padding: 0.8rem; border-radius: 6px; border: none; cursor: pointer;
    }
    .login-btn:hover { opacity: 0.9; }
    .login-error { color: var(--red); font-size: 0.85rem; margin-top: 0.6rem; display: none; }

    /* ── APP ── */
    #app { display: none; }
    header {
      background: var(--dark); padding: 0 2rem; height: 60px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .header-logo { font-size: 1.2rem; font-weight: 800; color: var(--white); }
    .header-logo span { color: var(--amber); }
    .header-right { display: flex; align-items: center; gap: 1rem; }
    .header-right a { color: rgba(255,255,255,0.6); font-size: 0.85rem; text-decoration: none; }
    .header-right a:hover { color: var(--amber); }
    #logoutBtn {
      background: none; border: 1px solid rgba(255,255,255,0.2); color: rgba(255,255,255,0.7);
      font-size: 0.82rem; padding: 0.35rem 0.9rem; border-radius: 4px; cursor: pointer;
    }
    #logoutBtn:hover { border-color: var(--amber); color: var(--amber); }

    .app-body { padding: 2rem; max-width: 1100px; margin: 0 auto; }
    .app-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 1rem; }
    .app-header h1 { font-size: 1.4rem; font-weight: 800; color: var(--dark); }
    .app-header p { font-size: 0.87rem; color: var(--muted); margin-top: 0.2rem; }

    /* ── TOAST ── */
    #toast {
      position: fixed; top: 1.2rem; right: 1.2rem;
      background: var(--green); color: var(--white);
      font-size: 0.88rem; font-weight: 600;
      padding: 0.7rem 1.2rem; border-radius: 6px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.15);
      z-index: 999; display: none; align-items: center; gap: 0.5rem;
    }
    #toast.error { background: var(--red); }
    #toast.show { display: flex; }

    /* ── PROMO LIST ── */
    #promoList { display: flex; flex-direction: column; gap: 1rem; }
    .promo-row {
      background: var(--white); border: 1px solid var(--border); border-radius: 10px;
      padding: 1.2rem 1.4rem; display: flex; align-items: center; gap: 1.2rem;
      transition: border-color .2s;
    }
    .promo-row:hover { border-color: var(--amber); }
    .promo-row.inactive { opacity: 0.55; }
    .promo-icon { font-size: 2rem; flex-shrink: 0; }
    .promo-info { flex: 1; }
    .promo-info h3 { font-size: 1rem; font-weight: 700; color: var(--dark); }
    .promo-info p { font-size: 0.85rem; color: var(--muted); margin-top: 0.2rem; line-height: 1.5; }
    .promo-badge {
      font-size: 0.72rem; font-weight: 700; padding: 0.2rem 0.6rem;
      border-radius: 20px; margin-top: 0.4rem; display: inline-block;
    }
    .badge-amber { background: rgba(245,166,35,0.15); color: #b45309; }
    .badge-green  { background: rgba(16,185,129,0.12); color: #065f46; }
    .badge-blue   { background: rgba(59,130,246,0.12); color: #1e40af; }
    .badge-red    { background: rgba(239,68,68,0.12);  color: #991b1b; }
    .promo-actions { display: flex; gap: 0.5rem; flex-shrink: 0; }
    .btn-sm {
      font-size: 0.8rem; font-weight: 600; padding: 0.4rem 0.85rem;
      border-radius: 5px; border: 1.5px solid var(--border); cursor: pointer;
      background: none; color: var(--text); transition: all .15s; font-family: inherit;
    }
    .btn-sm:hover { background: var(--bg); }
    .btn-sm.edit { border-color: var(--amber); color: var(--dark); }
    .btn-sm.edit:hover { background: rgba(245,166,35,0.1); }
    .btn-sm.del { border-color: #fca5a5; color: var(--red); }
    .btn-sm.del:hover { background: #fef2f2; }
    .btn-sm.toggle { border-color: #6ee7b7; color: var(--green); }
    .btn-sm.toggle:hover { background: #f0fdf4; }
    .btn-sm.toggle.off { border-color: var(--border); color: var(--muted); }

    /* ── MODAL ── */
    .modal-bg {
      position: fixed; inset: 0; background: rgba(13,27,42,0.55);
      z-index: 100; display: none; align-items: center; justify-content: center; padding: 1rem;
    }
    .modal-bg.open { display: flex; }
    .modal {
      background: var(--white); border-radius: 12px; padding: 2rem;
      width: 100%; max-width: 560px; max-height: 90vh; overflow-y: auto;
    }
    .modal h2 { font-size: 1.2rem; font-weight: 800; color: var(--dark); margin-bottom: 1.5rem; }
    .form-group { margin-bottom: 1rem; }
    .form-group label { display: block; font-size: 0.82rem; font-weight: 600; color: var(--dark); margin-bottom: 0.35rem; }
    .form-group input, .form-group select, .form-group textarea {
      width: 100%; padding: 0.65rem 0.9rem; border: 1.5px solid var(--border);
      border-radius: 6px; font-size: 0.93rem; font-family: inherit;
      color: var(--text); outline: none; transition: border-color .2s;
    }
    .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: var(--amber); }
    .form-group textarea { resize: vertical; min-height: 80px; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 0.8rem; }
    .modal-actions { display: flex; gap: 0.8rem; justify-content: flex-end; margin-top: 1.5rem; }
    .btn-cancel {
      background: none; border: 1.5px solid var(--border); color: var(--muted);
      padding: 0.65rem 1.4rem; border-radius: 6px; cursor: pointer; font-size: 0.9rem; font-family: inherit;
    }
    .btn-save {
      background: var(--amber); color: var(--dark); font-weight: 700;
      padding: 0.65rem 1.8rem; border-radius: 6px; border: none; cursor: pointer;
      font-size: 0.9rem; font-family: inherit;
    }
    .btn-save:hover { opacity: 0.9; }

    /* ── ADD BUTTON ── */
    .btn-add {
      background: var(--amber); color: var(--dark); font-weight: 700;
      font-size: 0.9rem; padding: 0.65rem 1.4rem; border-radius: 6px;
      border: none; cursor: pointer; font-family: inherit;
    }
    .btn-add:hover { opacity: 0.9; }

    .save-all-bar {
      position: sticky; bottom: 0; background: var(--white);
      border-top: 1px solid var(--border); padding: 1rem 2rem;
      display: flex; align-items: center; justify-content: space-between;
      gap: 1rem; flex-wrap: wrap;
    }
    .save-all-bar p { font-size: 0.85rem; color: var(--muted); }
    .btn-publish {
      background: var(--dark); color: var(--white); font-weight: 700;
      font-size: 0.95rem; padding: 0.75rem 2rem; border-radius: 6px;
      border: none; cursor: pointer; font-family: inherit; transition: opacity .2s;
    }
    .btn-publish:hover { opacity: 0.85; }
    .btn-publish:disabled { opacity: 0.4; cursor: not-allowed; }

    .empty-state {
      text-align: center; padding: 3rem; color: var(--muted);
      background: var(--white); border: 2px dashed var(--border); border-radius: 10px;
    }
    .empty-state p { margin-top: 0.5rem; font-size: 0.9rem; }

    .drag-handle { cursor: grab; color: var(--border); font-size: 1.2rem; flex-shrink: 0; user-select: none; }
  </style>
</head>
<body>

<!-- LOGIN SCREEN -->
<div id="loginScreen">
  <div class="login-box">
    <div class="login-logo">Fix<span>Hive</span></div>
    <p>Admin — Promotions Manager</p>
    <input type="password" id="pwdInput" placeholder="Enter admin password" onkeydown="if(event.key==='Enter')doLogin()" />
    <button class="login-btn" onclick="doLogin()">Log In →</button>
    <div class="login-error" id="loginError">Incorrect password. Try again.</div>
  </div>
</div>

<!-- MAIN APP -->
<div id="app">
  <header>
    <div class="header-logo">Fix<span>Hive</span> <span style="color:rgba(255,255,255,0.35);font-weight:400;font-size:0.9rem">/ Admin</span></div>
    <div class="header-right">
      <a href="index.html" target="_blank">← View Site</a>
      <button id="logoutBtn" onclick="doLogout()">Log Out</button>
    </div>
  </header>

  <div class="app-body">
    <div class="app-header">
      <div>
        <h1>Promotions</h1>
        <p>Create and manage promotions shown on the homepage. Changes go live when you click Publish.</p>
      </div>
      <button class="btn-add" onclick="openModal()">+ New Promotion</button>
    </div>

    <div id="promoList"></div>
  </div>

  <div class="save-all-bar">
    <p id="changeNote">No unsaved changes.</p>
    <button class="btn-publish" id="publishBtn" onclick="publishPromos()" disabled>Publish Changes</button>
  </div>
</div>

<!-- TOAST -->
<div id="toast"></div>

<!-- EDIT MODAL -->
<div class="modal-bg" id="modalBg" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <h2 id="modalTitle">New Promotion</h2>
    <div class="form-row">
      <div class="form-group">
        <label>Icon (emoji)</label>
        <input type="text" id="fIcon" placeholder="❄️" maxlength="4" />
      </div>
      <div class="form-group">
        <label>Badge Label</label>
        <input type="text" id="fBadge" placeholder="e.g. Limited Time" maxlength="30" />
      </div>
    </div>
    <div class="form-group">
      <label>Title *</label>
      <input type="text" id="fTitle" placeholder="e.g. Summer AC Special" maxlength="60" />
    </div>
    <div class="form-group">
      <label>Description *</label>
      <textarea id="fDesc" placeholder="Describe the promotion..."></textarea>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Badge Colour</label>
        <select id="fBadgeColor">
          <option value="amber">🟡 Amber</option>
          <option value="green">🟢 Green</option>
          <option value="blue">🔵 Blue</option>
          <option value="red">🔴 Red</option>
        </select>
      </div>
      <div class="form-group">
        <label>CTA Button Text</label>
        <input type="text" id="fCta" placeholder="Book Now" maxlength="30" />
      </div>
    </div>
    <div class="form-group">
      <label>CTA URL / WhatsApp Link</label>
      <input type="url" id="fCtaUrl" placeholder="https://wa.me/971541699500?text=Hey%2C%20I%20saw%20your%20website%2C%20I%20wanted%20to%20book%20an%20appointment" />
    </div>
    <div class="form-group">
      <label>
        <input type="checkbox" id="fActive" checked style="width:auto;margin-right:0.4rem" />
        Active (show on website)
      </label>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn-save" onclick="savePromo()">Save Promotion</button>
    </div>
  </div>
</div>

<script>
  const PASS = 'fixhive2025!';
  const API  = 'api/save-promos.php';
  let promos = [];
  let editingId = null;
  let dirty = false;

  /* ── AUTH ── */
  function doLogin() {
    const pwd = document.getElementById('pwdInput').value;
    if (pwd === PASS) {
      sessionStorage.setItem('fh_auth', PASS);
      document.getElementById('loginScreen').style.display = 'none';
      document.getElementById('app').style.display = 'block';
      loadPromos();
    } else {
      document.getElementById('loginError').style.display = 'block';
    }
  }
  function doLogout() {
    sessionStorage.removeItem('fh_auth');
    location.reload();
  }
  window.onload = () => {
    if (sessionStorage.getItem('fh_auth') === PASS) {
      document.getElementById('loginScreen').style.display = 'none';
      document.getElementById('app').style.display = 'block';
      loadPromos();
    }
  };

  /* ── LOAD ── */
  async function loadPromos() {
    try {
      const r = await fetch('data/promotions.json?_=' + Date.now());
      promos = await r.json();
      render();
    } catch(e) {
      showToast('Failed to load promotions.', true);
    }
  }

  /* ── RENDER ── */
  function render() {
    const list = document.getElementById('promoList');
    if (!promos.length) {
      list.innerHTML = `<div class="empty-state"><div style="font-size:2.5rem">📢</div><p>No promotions yet. Click "+ New Promotion" to create one.</p></div>`;
      return;
    }
    list.innerHTML = promos.map((p, i) => `
      <div class="promo-row ${p.active ? '' : 'inactive'}">
        <div class="drag-handle" title="Drag to reorder">⠿</div>
        <div class="promo-icon">${p.icon || '🔧'}</div>
        <div class="promo-info">
          <h3>${esc(p.title)}</h3>
          <p>${esc(p.description)}</p>
          <span class="promo-badge badge-${p.badgeColor || 'amber'}">${esc(p.badge)}</span>
        </div>
        <div class="promo-actions">
          <button class="btn-sm toggle ${p.active ? '' : 'off'}" onclick="toggleActive(${i})">${p.active ? 'Hide' : 'Show'}</button>
          <button class="btn-sm edit" onclick="openModal(${i})">Edit</button>
          <button class="btn-sm del" onclick="deletePromo(${i})">Delete</button>
        </div>
      </div>
    `).join('');
  }

  function esc(str) {
    return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  /* ── MODAL ── */
  function openModal(idx) {
    editingId = idx ?? null;
    const p = idx !== null && idx !== undefined ? promos[idx] : {};
    document.getElementById('modalTitle').textContent = editingId !== null ? 'Edit Promotion' : 'New Promotion';
    document.getElementById('fIcon').value       = p.icon        || '🔧';
    document.getElementById('fBadge').value      = p.badge       || '';
    document.getElementById('fTitle').value      = p.title       || '';
    document.getElementById('fDesc').value       = p.description || '';
    document.getElementById('fBadgeColor').value = p.badgeColor  || 'amber';
    document.getElementById('fCta').value        = p.cta         || 'Book Now';
    document.getElementById('fCtaUrl').value     = p.ctaUrl      || 'https://wa.me/971541699500?text=Hey%2C%20I%20saw%20your%20website%2C%20I%20wanted%20to%20book%20an%20appointment';
    document.getElementById('fActive').checked   = p.active !== false;
    document.getElementById('modalBg').classList.add('open');
    document.getElementById('fTitle').focus();
  }
  function closeModal() {
    document.getElementById('modalBg').classList.remove('open');
    editingId = null;
  }

  function savePromo() {
    const title = document.getElementById('fTitle').value.trim();
    const desc  = document.getElementById('fDesc').value.trim();
    if (!title || !desc) { showToast('Title and description are required.', true); return; }
    const promo = {
      id:          editingId !== null ? promos[editingId].id : Date.now(),
      title,
      description: desc,
      badge:       document.getElementById('fBadge').value.trim(),
      badgeColor:  document.getElementById('fBadgeColor').value,
      cta:         document.getElementById('fCta').value.trim() || 'Book Now',
      ctaUrl:      document.getElementById('fCtaUrl').value.trim(),
      icon:        document.getElementById('fIcon').value.trim() || '🔧',
      active:      document.getElementById('fActive').checked,
    };
    if (editingId !== null) promos[editingId] = promo;
    else promos.push(promo);
    closeModal();
    markDirty();
    render();
  }

  function deletePromo(idx) {
    if (!confirm(`Delete "${promos[idx].title}"?`)) return;
    promos.splice(idx, 1);
    markDirty();
    render();
  }

  function toggleActive(idx) {
    promos[idx].active = !promos[idx].active;
    markDirty();
    render();
  }

  /* ── DIRTY STATE ── */
  function markDirty() {
    dirty = true;
    document.getElementById('changeNote').textContent = '⚠️ You have unsaved changes.';
    document.getElementById('changeNote').style.color = '#b45309';
    document.getElementById('publishBtn').disabled = false;
  }

  /* ── PUBLISH ── */
  async function publishPromos() {
    const btn = document.getElementById('publishBtn');
    btn.disabled = true;
    btn.textContent = 'Publishing…';
    try {
      const r = await fetch(API, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-Auth': PASS },
        body: JSON.stringify(promos)
      });
      const data = await r.json();
      if (!data.ok) throw new Error(data.error || 'Unknown error');
      showToast(`✅ Published! ${data.saved} promotion${data.saved !== 1 ? 's' : ''} live.`);
      dirty = false;
      document.getElementById('changeNote').textContent = 'All changes published.';
      document.getElementById('changeNote').style.color = '#059669';
    } catch(e) {
      showToast('Publish failed: ' + e.message, true);
      btn.disabled = false;
    }
    btn.textContent = 'Publish Changes';
  }

  /* ── TOAST ── */
  function showToast(msg, isError) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'show' + (isError ? ' error' : '');
    setTimeout(() => t.className = '', 3500);
  }

  /* ── WARN ON LEAVE ── */
  window.addEventListener('beforeunload', e => {
    if (dirty) { e.preventDefault(); e.returnValue = ''; }
  });
</script>
</body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#052e16"/>
      <stop offset="55%" stop-color="#14532d"/>
      <stop offset="100%" stop-color="#166534"/>
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#16a34a" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#16a34a" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="200" fill="url(#bg)"/>

  <!-- Radial glow behind badge -->
  <ellipse cx="200" cy="100" rx="140" ry="100" fill="url(#glow2)"/>

  <!-- UAE Crescent (left side) -->
  <g transform="translate(88,100)" filter="url(#glow)" opacity="0.7">
    <path d="M0,-45 A45,45 0 1,1 0,45 A32,32 0 1,0 0,-45 Z" fill="none" stroke="#86efac" stroke-width="2"/>
    <!-- Stars -->
    <g transform="translate(28,-18)">
      <polygon points="0,-8 2,-3 7,-3 3,1 5,6 0,3 -5,6 -3,1 -7,-3 -2,-3" fill="#86efac" opacity="0.8"/>
    </g>
    <g transform="translate(32,0)">
      <polygon points="0,-5 1.5,-2 5,-2 2,1 3,4 0,2 -3,4 -2,1 -5,-2 -1.5,-2" fill="#86efac" opacity="0.7"/>
    </g>
    <g transform="translate(26,20)">
      <polygon points="0,-6 2,-2 6,-2 3,1 4,5 0,3 -4,5 -3,1 -6,-2 -2,-2" fill="#86efac" opacity="0.75"/>
    </g>
  </g>

  <!-- Main discount badge circle -->
  <circle cx="218" cy="97" r="68" fill="#14532d" stroke="#eab308" stroke-width="2.5" filter="url(#softglow)"/>
  <circle cx="218" cy="97" r="62" fill="none" stroke="#eab308" stroke-width="1" stroke-opacity="0.4" stroke-dasharray="5 3"/>

  <!-- 25% text -->
  <text x="218" y="88" text-anchor="middle" font-family="Arial Black,Arial,sans-serif" font-size="44" font-weight="900" fill="url(#badgeGrad)" filter="url(#glow)">25%</text>
  <text x="218" y="110" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#86efac" letter-spacing="2">OFF</text>
  <line x1="192" y1="116" x2="244" y2="116" stroke="#eab308" stroke-width="1" opacity="0.5"/>
  <text x="218" y="128" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" font-weight="600" fill="#86efac" opacity="0.7" letter-spacing="1.5">FAZAA MEMBERS</text>

  <!-- Gold star accents -->
  <g transform="translate(85,42)" opacity="0.6">
    <polygon points="0,-10 3,-4 9,-4 4,1 6,7 0,4 -6,7 -4,1 -9,-4 -3,-4" fill="#eab308"/>
  </g>
  <g transform="translate(346,55)" opacity="0.5">
    <polygon points="0,-8 2.5,-3 7,-3 3,1 5,6 0,3 -5,6 -3,1 -7,-3 -2.5,-3" fill="#eab308"/>
  </g>
  <g transform="translate(56,140)" opacity="0.4">
    <polygon points="0,-6 2,-2 6,-2 3,1 4,5 0,3 -4,5 -3,1 -6,-2 -2,-2" fill="#eab308"/>
  </g>
  <g transform="translate(362,148)" opacity="0.4">
    <polygon points="0,-7 2,-3 7,-3 3,1 4,5 0,3 -4,5 -3,1 -7,-3 -2,-3" fill="#eab308"/>
  </g>

  <!-- Subtle dot pattern -->
  <circle cx="130" cy="155" r="1.5" fill="#86efac" opacity="0.2"/>
  <circle cx="310" cy="160" r="1.5" fill="#86efac" opacity="0.2"/>
  <circle cx="40" cy="75" r="1.5" fill="#86efac" opacity="0.2"/>
  <circle cx="375" cy="80" r="1.5" fill="#86efac" opacity="0.2"/>

  <!-- Bottom fade -->
  <rect x="0" y="160" width="400" height="40" fill="url(#bg)" opacity="0.5"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c4a6e"/>
      <stop offset="60%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="carGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#7dd3fc"/>
    </linearGradient>
    <linearGradient id="iceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#7dd3fc" stop-opacity="0.08"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="200" fill="url(#bg)"/>

  <!-- Ice crystal background shapes -->
  <polygon points="200,8 216,28 200,48 184,28" fill="none" stroke="#bae6fd" stroke-width="0.8" opacity="0.2"/>
  <polygon points="200,2 230,35 200,68 170,35" fill="none" stroke="#bae6fd" stroke-width="0.6" opacity="0.12"/>

  <!-- Ice cube isometric - back faces -->
  <polygon points="200,38 310,83 310,153 200,108" fill="#0c4a6e" stroke="#7dd3fc" stroke-width="1.2" stroke-opacity="0.5" fill-opacity="0.9"/>
  <polygon points="200,38 90,83 90,153 200,108" fill="#075985" stroke="#7dd3fc" stroke-width="1.2" stroke-opacity="0.5" fill-opacity="0.9"/>

  <!-- Ice cube top face -->
  <polygon points="200,38 310,83 200,128 90,83" fill="url(#iceGrad)" stroke="#bae6fd" stroke-width="1.5" stroke-opacity="0.8"/>

  <!-- Inner ice glow -->
  <polygon points="200,42 302,83 200,124 98,83" fill="none" stroke="#e0f2fe" stroke-width="0.5" stroke-opacity="0.3"/>

  <!-- Car on top face (isometric projection, centered) -->
  <!-- Car body base -->
  <g filter="url(#glow)">
    <!-- Car body - isometric skewed rectangle -->
    <path d="M165,83 L235,83 L248,91 L248,101 L235,109 L165,109 L152,101 L152,91 Z" fill="url(#carGrad)" opacity="0.95"/>
    <!-- Roof -->
    <path d="M175,83 L225,83 L232,76 L220,70 L180,70 L168,76 Z" fill="#e0f2fe" opacity="0.9"/>
    <!-- Windscreen -->
    <path d="M178,83 L222,83 L229,77 L220,72 L180,72 L171,77 Z" fill="#bae6fd" opacity="0.5"/>
    <!-- Wheel arch front -->
    <ellipse cx="235" cy="103" rx="10" ry="6" fill="#0c4a6e" stroke="#7dd3fc" stroke-width="1"/>
    <!-- Wheel arch rear -->
    <ellipse cx="165" cy="103" rx="10" ry="6" fill="#0c4a6e" stroke="#7dd3fc" stroke-width="1"/>
    <!-- Wheel front -->
    <ellipse cx="235" cy="103" rx="7" ry="4.5" fill="#0a3d5c"/>
    <!-- Wheel rear -->
    <ellipse cx="165" cy="103" rx="7" ry="4.5" fill="#0a3d5c"/>
  </g>

  <!-- Snowflake macro - left -->
  <g transform="translate(48,58)" opacity="0.75" filter="url(#glow)">
    <line x1="0" y1="-18" x2="0" y2="18" stroke="#bae6fd" stroke-width="2"/>
    <line x1="-18" y1="0" x2="18" y2="0" stroke="#bae6fd" stroke-width="2"/>
    <line x1="-13" y1="-13" x2="13" y2="13" stroke="#bae6fd" stroke-width="2"/>
    <line x1="13" y1="-13" x2="-13" y2="13" stroke="#bae6fd" stroke-width="2"/>
    <circle cx="0" cy="-18" r="2.5" fill="#e0f2fe"/>
    <circle cx="0" cy="18" r="2.5" fill="#e0f2fe"/>
    <circle cx="-18" cy="0" r="2.5" fill="#e0f2fe"/>
    <circle cx="18" cy="0" r="2.5" fill="#e0f2fe"/>
    <circle cx="-13" cy="-13" r="2" fill="#e0f2fe"/>
    <circle cx="13" cy="13" r="2" fill="#e0f2fe"/>
    <circle cx="13" cy="-13" r="2" fill="#e0f2fe"/>
    <circle cx="-13" cy="13" r="2" fill="#e0f2fe"/>
  </g>

  <!-- Snowflake right -->
  <g transform="translate(352,55)" opacity="0.7" filter="url(#glow)">
    <line x1="0" y1="-16" x2="0" y2="16" stroke="#bae6fd" stroke-width="1.8"/>
    <line x1="-16" y1="0" x2="16" y2="0" stroke="#bae6fd" stroke-width="1.8"/>
    <line x1="-11" y1="-11" x2="11" y2="11" stroke="#bae6fd" stroke-width="1.8"/>
    <line x1="11" y1="-11" x2="-11" y2="11" stroke="#bae6fd" stroke-width="1.8"/>
    <circle cx="0" cy="-16" r="2" fill="#e0f2fe"/>
    <circle cx="0" cy="16" r="2" fill="#e0f2fe"/>
    <circle cx="-16" cy="0" r="2" fill="#e0f2fe"/>
    <circle cx="16" cy="0" r="2" fill="#e0f2fe"/>
  </g>

  <!-- Small snowflakes scattered -->
  <g transform="translate(88,28)" opacity="0.5">
    <line x1="0" y1="-8" x2="0" y2="8" stroke="#bae6fd" stroke-width="1.2"/>
    <line x1="-8" y1="0" x2="8" y2="0" stroke="#bae6fd" stroke-width="1.2"/>
    <line x1="-6" y1="-6" x2="6" y2="6" stroke="#bae6fd" stroke-width="1.2"/>
    <line x1="6" y1="-6" x2="-6" y2="6" stroke="#bae6fd" stroke-width="1.2"/>
  </g>
  <g transform="translate(320,30)" opacity="0.5">
    <line x1="0" y1="-8" x2="0" y2="8" stroke="#bae6fd" stroke-width="1.2"/>
    <line x1="-8" y1="0" x2="8" y2="0" stroke="#bae6fd" stroke-width="1.2"/>
    <line x1="-6" y1="-6" x2="6" y2="6" stroke="#bae6fd" stroke-width="1.2"/>
    <line x1="6" y1="-6" x2="-6" y2="6" stroke="#bae6fd" stroke-width="1.2"/>
  </g>
  <g transform="translate(155,22)" opacity="0.4">
    <line x1="0" y1="-5" x2="0" y2="5" stroke="#bae6fd" stroke-width="1"/>
    <line x1="-5" y1="0" x2="5" y2="0" stroke="#bae6fd" stroke-width="1"/>
    <line x1="-3.5" y1="-3.5" x2="3.5" y2="3.5" stroke="#bae6fd" stroke-width="1"/>
    <line x1="3.5" y1="-3.5" x2="-3.5" y2="3.5" stroke="#bae6fd" stroke-width="1"/>
  </g>
  <g transform="translate(248,18)" opacity="0.4">
    <line x1="0" y1="-5" x2="0" y2="5" stroke="#bae6fd" stroke-width="1"/>
    <line x1="-5" y1="0" x2="5" y2="0" stroke="#bae6fd" stroke-width="1"/>
    <line x1="-3.5" y1="-3.5" x2="3.5" y2="3.5" stroke="#bae6fd" stroke-width="1"/>
    <line x1="3.5" y1="-3.5" x2="-3.5" y2="3.5" stroke="#bae6fd" stroke-width="1"/>
  </g>

  <!-- Floating ice particles -->
  <circle cx="70" cy="155" r="3" fill="#bae6fd" opacity="0.3"/>
  <circle cx="330" cy="148" r="2.5" fill="#bae6fd" opacity="0.25"/>
  <circle cx="130" cy="168" r="2" fill="#bae6fd" opacity="0.2"/>
  <circle cx="270" cy="170" r="2" fill="#bae6fd" opacity="0.2"/>
  <circle cx="40" cy="130" r="1.5" fill="#e0f2fe" opacity="0.3"/>
  <circle cx="360" cy="125" r="1.5" fill="#e0f2fe" opacity="0.3"/>

  <!-- Bottom vignette -->
  <rect x="0" y="150" width="400" height="50" fill="url(#bg)" opacity="0.5"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0a2e"/>
      <stop offset="55%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#2e1065"/>
    </linearGradient>
    <linearGradient id="gearL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="gearR" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <radialGradient id="glowC" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="200" fill="url(#bg)"/>
  <ellipse cx="200" cy="100" rx="160" ry="110" fill="url(#glowC)"/>

  <!-- Gear LEFT (9 teeth) -->
  <g transform="translate(148,100)">
    <!-- Gear teeth -->
    <path d="
      M-8,-52 L8,-52 L10,-40 L-10,-40 Z
      M30,-44 L38,-32 L28,-25 L20,-37 Z
      M50,-20 L54,-7 L42,-3 L38,-16 Z
      M52,10 L48,23 L36,19 L40,6 Z
      M30,38 L20,48 L12,37 L22,27 Z
      M-8,52 L8,52 L10,40 L-10,40 Z
      M-30,44 L-20,48 L-12,37 L-22,27 Z
      M-52,10 L-48,23 L-36,19 L-40,6 Z
      M-50,-20 L-54,-7 L-42,-3 L-38,-16 Z
      M-30,-44 L-38,-32 L-28,-25 L-20,-37 Z
    " fill="url(#gearL)"/>
    <!-- Gear body -->
    <circle r="38" fill="url(#gearL)" opacity="0.9"/>
    <!-- Inner ring -->
    <circle r="28" fill="#1e1b4b"/>
    <circle r="22" fill="none" stroke="#818cf8" stroke-width="1.5" opacity="0.6"/>
    <!-- Hub -->
    <circle r="10" fill="#0f0a2e" stroke="#818cf8" stroke-width="2" filter="url(#glow)"/>
    <circle r="4" fill="#818cf8"/>
    <!-- Spokes -->
    <line x1="0" y1="-22" x2="0" y2="-10" stroke="#818cf8" stroke-width="2" opacity="0.5"/>
    <line x1="0" y1="10" x2="0" y2="22" stroke="#818cf8" stroke-width="2" opacity="0.5"/>
    <line x1="-22" y1="0" x2="-10" y2="0" stroke="#818cf8" stroke-width="2" opacity="0.5"/>
    <line x1="10" y1="0" x2="22" y2="0" stroke="#818cf8" stroke-width="2" opacity="0.5"/>
    <line x1="-15" y1="-15" x2="-7" y2="-7" stroke="#818cf8" stroke-width="1.5" opacity="0.4"/>
    <line x1="7" y1="7" x2="15" y2="15" stroke="#818cf8" stroke-width="1.5" opacity="0.4"/>
    <line x1="15" y1="-15" x2="7" y2="-7" stroke="#818cf8" stroke-width="1.5" opacity="0.4"/>
    <line x1="-7" y1="7" x2="-15" y2="15" stroke="#818cf8" stroke-width="1.5" opacity="0.4"/>
  </g>

  <!-- Gear RIGHT (7 teeth, smaller, interlocked) -->
  <g transform="translate(262,100)">
    <path d="
      M-7,-43 L7,-43 L9,-33 L-9,-33 Z
      M25,-36 L31,-25 L22,-19 L16,-30 Z
      M41,-10 L43,2 L33,4 L31,-8 Z
      M38,22 L31,32 L22,25 L29,15 Z
      M16,37 L7,44 L0,34 L9,27 Z
      M-7,43 L7,43 L9,33 L-9,33 Z
      M-25,36 L-16,42 L-10,32 L-19,26 Z
      M-41,10 L-38,22 L-28,18 L-31,6 Z
      M-38,-22 L-31,-32 L-22,-26 L-29,-16 Z
      M-16,-37 L-7,-44 L0,-34 L-9,-27 Z
    " fill="url(#gearR)"/>
    <circle r="30" fill="url(#gearR)" opacity="0.9"/>
    <circle r="22" fill="#1e1b4b"/>
    <circle r="17" fill="none" stroke="#a78bfa" stroke-width="1.5" opacity="0.6"/>
    <circle r="8" fill="#0f0a2e" stroke="#a78bfa" stroke-width="2" filter="url(#glow)"/>
    <circle r="3" fill="#a78bfa"/>
    <line x1="0" y1="-17" x2="0" y2="-8" stroke="#a78bfa" stroke-width="1.8" opacity="0.5"/>
    <line x1="0" y1="8" x2="0" y2="17" stroke="#a78bfa" stroke-width="1.8" opacity="0.5"/>
    <line x1="-17" y1="0" x2="-8" y2="0" stroke="#a78bfa" stroke-width="1.8" opacity="0.5"/>
    <line x1="8" y1="0" x2="17" y2="0" stroke="#a78bfa" stroke-width="1.8" opacity="0.5"/>
  </g>

  <!-- Flow arrows (fluid circulation) -->
  <g opacity="0.55" filter="url(#glow)">
    <!-- Top arc arrow -->
    <path d="M100,52 Q200,18 300,52" fill="none" stroke="#a78bfa" stroke-width="1.8" stroke-dasharray="5 3"/>
    <polygon points="300,52 290,44 296,58" fill="#a78bfa"/>
    <!-- Bottom arc arrow -->
    <path d="M300,148 Q200,182 100,148" fill="none" stroke="#818cf8" stroke-width="1.8" stroke-dasharray="5 3"/>
    <polygon points="100,148 110,156 104,142" fill="#818cf8"/>
  </g>

  <!-- Mesh point indicator -->
  <circle cx="205" cy="100" r="5" fill="#c4b5fd" opacity="0.6" filter="url(#glow)"/>
  <circle cx="205" cy="100" r="2.5" fill="#e9d5ff"/>

  <!-- Background grid dots -->
  <g opacity="0.08">
    <circle cx="40" cy="40" r="1.5" fill="#818cf8"/>
    <circle cx="360" cy="40" r="1.5" fill="#818cf8"/>
    <circle cx="40" cy="160" r="1.5" fill="#818cf8"/>
    <circle cx="360" cy="160" r="1.5" fill="#818cf8"/>
    <circle cx="70" cy="170" r="1" fill="#818cf8"/>
    <circle cx="330" cy="170" r="1" fill="#818cf8"/>
  </g>

  <!-- Bottom fade -->
  <rect x="0" y="158" width="400" height="42" fill="url(#bg)" opacity="0.5"/>
</svg>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Luca Lietaert — FixHive Automotive</title>
<meta name="description" content="Contact card for Luca Lietaert, FixHive Automotive — Dubai Investment Park 1.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #FDFBF7;
    --paper-soft: #F6F1E9;
    --ink: #16130F;
    --ink-soft: #514A40;
    --amber: #E97715;
    --amber-deep: #B85610;
    --honey: #FFC98A;
    --line: #E7DFD2;
    --white: #FFFFFF;
    --radius: 26px;
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0;
    min-height:100vh;
    background: radial-gradient(120% 120% at 50% -10%, #2A241C 0%, #16130F 55%, #0E0C09 100%);
    font-family:'Inter', sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 16px;
  }

  .stage{
    width:100%;
    max-width:400px;
    position:relative;
  }

  .card{
    position:relative;
    background:var(--paper);
    border-radius: var(--radius);
    overflow:hidden;
    box-shadow: 0 30px 60px -20px rgba(0,0,0,0.55), 0 0 0 1px rgba(255,255,255,0.03);
  }

  /* ---- Header ---- */
  .header{
    position:relative;
    background: var(--paper);
    padding: 40px 28px 22px;
    text-align:center;
    overflow:hidden;
  }

  .hex-field{
    position:absolute;
    inset:0;
    pointer-events:none;
    opacity:0.55;
  }

  .logo{
    position:relative;
    width:168px;
    height:auto;
    margin:0 auto 22px;
    display:block;
  }

  .name{
    font-family:'Poppins', sans-serif;
    font-weight:800;
    font-size:26px;
    letter-spacing:0.2px;
    color:var(--ink);
    margin:0 0 6px;
  }

  .role{
    font-size:12px;
    font-weight:600;
    letter-spacing:2.2px;
    text-transform:uppercase;
    color:var(--amber-deep);
    line-height:1.6;
    margin:0;
  }

  /* ---- Debossed hex watermark (sunk into the paper) ---- */
  .hex-watermark{
    position:absolute;
    right:-20px;
    bottom:-10px;
    width:260px;
    height:300px;
    z-index:0;
    pointer-events:none;
  }

  .hex-watermark .hx{
    position:absolute;
    background: linear-gradient(150deg, #ECE0C8 0%, #F3ECDC 55%, #E9DCC0 100%);
    box-shadow:
      inset 3px 4px 7px rgba(110,88,54,0.28),
      inset -3px -4px 7px rgba(255,255,255,0.95);
  }

  .hex-watermark .hx-big{
    width:210px;
    height:242px;
    left:24px;
    top:52px;
    clip-path: polygon(50% 0%, 95% 26%, 95% 74%, 50% 100%, 5% 74%, 5% 26%);
    opacity:0.9;
  }

  .hex-watermark .hx-small{
    width:106px;
    height:124px;
    right:10px;
    top:0;
    clip-path: polygon(50% 0%, 95% 26%, 95% 74%, 50% 100%, 5% 74%, 5% 26%);
    opacity:0.9;
  }

  /* ---- Hex divider / slogan ---- */
  .divider{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    padding: 14px 24px 2px;
    position:relative;
    z-index:1;
  }

  .body-panel{
    position:relative;
  }

  .divider .rule{
    flex:1;
    height:1px;
    background:var(--line);
  }

  .hexdot{
    width:7px;
    height:7px;
    background:var(--amber);
    clip-path: polygon(50% 0%, 93% 25%, 93% 75%, 50% 100%, 7% 75%, 7% 25%);
    flex:0 0 auto;
  }

  .slogan{
    position:relative;
    z-index:1;
    text-align:center;
    font-family:'Poppins', sans-serif;
    font-weight:700;
    font-size:14px;
    letter-spacing:1px;
    text-transform:uppercase;
    color:var(--ink-soft);
    padding: 10px 24px 16px;
    margin:0;
  }

  .slogan span{ color:var(--amber-deep); }

  /* ---- Contact list ---- */
  .contacts{
    position:relative;
    z-index:1;
    padding: 2px 22px 4px;
    display:flex;
    flex-direction:column;
    gap:2px;
  }

  .contact-row{
    display:flex;
    align-items:center;
    gap:14px;
    padding:9px 10px;
    border-radius:14px;
    text-decoration:none;
    color:var(--ink);
    transition: background .18s ease;
  }

  .contact-row:hover, .contact-row:focus-visible{
    background: var(--paper-soft);
    outline: none;
  }

  .contact-row:focus-visible{
    box-shadow: 0 0 0 2px var(--amber);
  }

  .hexbadge{
    flex:0 0 auto;
    width:42px;
    height:42px;
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .hexbadge svg.hexshape{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
  }

  .hexbadge svg.icon{
    position:relative;
    width:18px;
    height:18px;
    z-index:1;
  }

  .contact-text{
    display:flex;
    flex-direction:column;
    line-height:1.25;
    min-width:0;
  }

  .contact-label{
    font-size:10.5px;
    font-weight:600;
    letter-spacing:1.4px;
    text-transform:uppercase;
    color:var(--ink-soft);
  }

  .contact-value{
    font-size:15px;
    font-weight:600;
    color:var(--ink);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  /* ---- Actions ---- */
  .actions{
    position:relative;
    z-index:1;
    display:flex;
    gap:8px;
    padding: 14px 22px 4px;
  }

  .btn{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    padding:13px 8px;
    border-radius:14px;
    font-family:'Inter', sans-serif;
    font-weight:700;
    font-size:12.5px;
    white-space:nowrap;
    text-decoration:none;
    border:none;
    cursor:pointer;
    transition: transform .15s ease, box-shadow .15s ease;
  }

  .btn:active{ transform: scale(0.97); }

  .btn-primary{
    background: linear-gradient(135deg, var(--amber), var(--amber-deep));
    color:var(--white);
    box-shadow: 0 10px 22px -8px rgba(184,86,16,0.55);
  }

  .btn-secondary{
    background: var(--paper-soft);
    color:var(--ink);
    border:1px solid var(--line);
  }

  .btn svg{ width:15px; height:15px; flex:0 0 auto; }

  /* ---- QR fallback ---- */
  .qr-block{
    position:relative;
    z-index:1;
    margin: 14px 22px 4px;
    padding: 12px;
    border-radius:16px;
    background: var(--paper-soft);
    border:1px solid var(--line);
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .qr-block img{
    width:96px;
    height:96px;
    border-radius:8px;
    background:var(--paper);
  }

  /* ---- Footer ---- */
  .footer{
    position:relative;
    z-index:1;
    text-align:center;
    padding: 0 22px 26px;
  }

  .footer a{
    color:var(--ink-soft);
    font-size:12px;
    font-weight:600;
    letter-spacing:0.6px;
    text-decoration:none;
  }

  .footer a:hover{ color:var(--amber-deep); }

  @media (prefers-reduced-motion: no-preference){
    .card{ animation: rise .5s ease both; }
  }
  @keyframes rise{
    from{ opacity:0; transform: translateY(14px); }
    to{ opacity:1; transform: translateY(0); }
  }
</style>
</head>
